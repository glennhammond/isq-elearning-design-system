<!-- Knowledge Check 0.3.0 Candidate — Interaction Shell 0.1.0 -->
<link rel="stylesheet" type="text/css" href="https://xapistorage28032026.blob.core.windows.net/xapitestcourses/css/isq-rise-components-v1.0.0.css">
<!-- Candidate source additionally requires ../interaction-shell/interaction-shell.css until the shell is integrated into the next immutable Rise stylesheet release. -->

<section
  class="isq-block isq-block--standard isq-decision isq-interaction isq-interaction--knowledge-check"
  data-isq-knowledge-check
  data-component="isq-kc-single"
  aria-labelledby="isq-kc-single-title"
>
  <header class="isq-interaction__header">
    <span class="isq-interaction__type">Knowledge check</span>
    <h2 class="isq-interaction__title" id="isq-kc-single-title">
      Which action should come first?
    </h2>
  </header>

  <div
    class="isq-interaction__body"
    data-kc-question
    data-question-key="workplace-priority"
    data-correct-responses="urgent"
    data-activity-id="https://example.isq.qld.edu.au/xapi/demo/workplace-priority"
    data-activity-name="Workplace priority knowledge check"
    data-activity-description="Which action should come first?"
    data-parent-activity-id="https://example.isq.qld.edu.au/xapi/demo/activity"
    data-grouping-activity-id="https://example.isq.qld.edu.au/xapi/demo/course"
    data-correct-feedback="<p class='isq-body isq-body--strong'>Correct.</p><p class='isq-body'>Addressing an immediate safety issue takes priority over routine administration.</p>"
    data-incorrect-feedback="<p class='isq-body isq-body--strong'>Not quite.</p><p class='isq-body'>Consider which option involves an immediate risk that should be addressed before routine work.</p>"
  >
    <p class="isq-interaction__instruction">
      Select the best response, then check your answer.
    </p>

    <fieldset class="isq-options isq-interaction__options" aria-describedby="isq-kc-single-feedback">
      <legend class="isq-visually-hidden">Which action should come first?</legend>

      <label class="isq-option isq-interaction__option">
        <input type="radio" name="isq-kc-single-choice" value="urgent">
        <span>Address an immediate safety issue</span>
      </label>

      <label class="isq-option isq-interaction__option">
        <input type="radio" name="isq-kc-single-choice" value="routine">
        <span>Finish routine administration</span>
      </label>
    </fieldset>

    <div class="isq-decision-actions isq-interaction__actions">
      <button class="isq-button isq-button--primary" type="button" data-kc-check>
        Check answer
      </button>
    </div>

    <div
      class="isq-callout isq-decision-feedback isq-interaction__feedback"
      id="isq-kc-single-feedback"
      role="status"
      aria-live="polite"
      data-kc-feedback
      hidden
    ></div>
  </div>

  <!-- For Rise deployment, inline the governed contents of ../knowledge-check.js here. -->
</section>
