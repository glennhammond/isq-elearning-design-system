name: Custom Block Library QA

on:
  push:
    branches:
      - main
      - 'feat/custom-block-library-*'
  pull_request:
    paths:
      - 'custom-block-library/**'
      - 'validate_custom_block_library.py'
      - '.github/workflows/custom-block-library.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate governed component contracts
        run: python validate_custom_block_library.py
      - name: Compile Python validators
        run: python -m py_compile validate_custom_block_library.py
